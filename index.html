/* =========================
   QUIZ CODE
========================= */
let score = 0;
let totalAnswered = 0;
let questions = [];
let wrongQuestions = [];
let currentQuestion;
let correctAnswer;
let questionNumber = 0;
let answered = false;
let revisionMode = false;
/* Remove accents and capital letters
   so answers are easier to check */
function normalise(text) {
    return text
        .toLowerCase()
        .trim()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[.,!?¿¡]/g, "")
        .replace(/^(el|la|los|las|un|una|unos|unas)\s+/i, "");
}
/* Start a new 10-question quiz */
function startQuiz() {
    score = 0;
    totalAnswered = 0;
    /* Shuffle vocabulary and choose 10 */
    questions = [...vocabulary]
        .sort(() => Math.random() - 0.5)
        .slice(0, 10);
    wrongQuestions = [];
    questionNumber = 0;
    revisionMode = false;
    document.getElementById("score").textContent = score;
    document.getElementById("total").textContent = totalAnswered;
    document.getElementById("answer").style.display = "block";
    showQuestion();
}
/* Show the current question */
function showQuestion() {
    answered = false;
    document.getElementById("feedback").textContent = "";
    document.getElementById("feedback").className = "";
    document.getElementById("answer").value = "";
    document.getElementById("checkButton").style.display =
        "inline-block";
    document.getElementById("nextButton").style.display =
        "none";
    /* Choose question from normal round
       or mistakes round */
    if (!revisionMode) {
        currentQuestion = questions[questionNumber];
    } else {
        currentQuestion = wrongQuestions[questionNumber];
    }
    /* Randomly choose direction */
    const spanishToEnglish = Math.random() < 0.5;
    if (spanishToEnglish) {
        document.getElementById("word").textContent =
            currentQuestion.spanish;
        document.getElementById("direction").textContent =
            "Translate this Spanish word into English:";
        correctAnswer = currentQuestion.english;
    } else {
        document.getElementById("word").textContent =
            currentQuestion.english;
        document.getElementById("direction").textContent =
            "Translate this English word into Spanish:";
        correctAnswer = currentQuestion.spanish;
    }
    /* Update progress */
    if (!revisionMode) {
        document.querySelector(".progress").textContent =
            "Question " +
            (questionNumber + 1) +
            " of 10";
    } else {
        document.querySelector(".progress").textContent =
            "Practising mistakes: " +
            (questionNumber + 1) +
            " of " +
            wrongQuestions.length;
    }
    document.getElementById("answer").focus();
}
/* Check the answer */
function checkAnswer() {
    if (answered) return;
    const userAnswer =
        normalise(document.getElementById("answer").value);
    const correct =
        normalise(correctAnswer);
    if (userAnswer === "") {
        document.getElementById("feedback").textContent =
            "Type an answer first!";
        document.getElementById("feedback").className =
            "incorrect";
        return;
    }
    answered = true;
    totalAnswered++;
    /* Correct answer */
    if (userAnswer === correct) {
        score++;
        document.getElementById("feedback").textContent =
            "Correct!";
        document.getElementById("feedback").className =
            "correct";
        /* If in mistakes mode, remove
           the question once correct */
        if (revisionMode) {
            wrongQuestions.splice(questionNumber, 1);
            questionNumber--;
        }
    /* Incorrect answer */
    } else {
        document.getElementById("feedback").textContent =
            "Not quite! The answer is: " +
            correctAnswer;
        document.getElementById("feedback").className =
            "incorrect";
        /* Add wrong question to mistakes list
           during the original 10 questions */
        if (!revisionMode) {
            wrongQuestions.push(currentQuestion);
        }
    }
    document.getElementById("score").textContent =
        score;
    document.getElementById("total").textContent =
        totalAnswered;
    document.getElementById("checkButton").style.display =
        "none";
    document.getElementById("nextButton").style.display =
        "inline-block";
}
/* Move to next question */
function nextQuestion() {
    questionNumber++;
    /* Normal 10-question round */
    if (!revisionMode) {
        if (questionNumber < 10) {
            showQuestion();
        } else {
            /* Start mistakes round */
            if (wrongQuestions.length > 0) {
                revisionMode = true;
                questionNumber = 0;
                showQuestion();
            } else {
                finishQuiz();
            }
        }
    }
    /* Mistakes round */
    else {
        if (wrongQuestions.length > 0) {
            if (questionNumber >= wrongQuestions.length) {
                questionNumber = 0;
            }
            showQuestion();
        } else {
            finishQuiz();
        }
    }
}
/* Finish the quiz */
function finishQuiz() {
    document.getElementById("word").textContent =
        "Quiz Complete!";
    document.getElementById("direction").textContent =
        "Great work!";
    document.getElementById("answer").style.display =
        "none";
    document.getElementById("checkButton").style.display =
        "none";
    document.getElementById("nextButton").style.display =
        "none";
    /* Show Try Again button */
    document.getElementById("restartButton").style.display =
        "inline-block";
    document.getElementById("feedback").textContent =
        "You got " +
        score +
        " answers correct in " +
        totalAnswered +
        " attempts!";
    document.getElementById("feedback").className =
        "correct";
    document.querySelector(".progress").textContent =
        "You've completed GCSEspañol!";
}
/* Button events */
document.getElementById("checkButton")
    .addEventListener("click", checkAnswer);
document.getElementById("nextButton")
    .addEventListener("click", nextQuestion);
/* Allow Enter key */
document.getElementById("answer")
    .addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            if (!answered) {
                checkAnswer();
            } else {
                nextQuestion();
            }
        }
    });
/* Start quiz */
startQuiz();
</script>
</body>
</html>
